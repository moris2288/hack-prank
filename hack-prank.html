<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ALERT</title>
    <style>
        body {
            background-color: black;
            color: lime;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            overflow: hidden;
            text-align: center;
        }
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }
        #warning {
            font-size: 1.5rem;
            margin-top: 20vh;
            animation: blink 0.5s infinite;
            color: red;
            text-transform: uppercase;
        }
        #progress {
            font-size: 2rem;
            margin: 20px 0;
        }
        #details {
            font-size: 1rem;
            margin: 10px 0;
            color: yellow;
        }
        #fake-ip {
            font-size: 0.8rem;
            color: cyan;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    
    <div id="warning">⚠️ اخطار: افشای اطلاعات تلفن همراه شما</div>
    <div id="progress">0%</div>
    <div id="details">در حال اسکن دستگاه...</div>
    <div id="fake-ip">آدرس سرور: 192.168.1.105:8080</div>

    <audio id="alarmSound" loop>
        <source src="https://sedatoseda.com/wp-content/uploads/Fire-Alarm-Sound-2.mp3" type="audio/mpeg">
    </audio>

    <script>
        // افکت ماتریس (0 و 1های در حال ریزش)
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const chars = "01";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        
        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }
        
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#0f0";
            ctx.font = fontSize + "px monospace";
            
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        
        setInterval(drawMatrix, 50);

        // شبیه‌سازی پیشرفت هک
        const progress = document.getElementById('progress');
        const details = document.getElementById('details');
        const alaramSound = document.getElementById('alarmSound');
        let percent = 0;
        
        alaramSound.play();
        
        const hackInterval = setInterval(() => {
            percent += 1;
            progress.textContent = percent + "%";
            
            if (percent === 15) {
                details.textContent = "در حال دور زدن امنیت...";
            } else if (percent === 30) {
                details.textContent = "دسترسی به مخاطبین...";
            } else if (percent === 50) {
                details.textContent = "دانلود تصاویر شخصی...";
            } else if (percent === 75) {
                details.textContent = "آماده‌سازی برای ارسال داده...";
            } else if (percent === 90) {
                details.textContent = "پاک‌کردن ردپا...";
            }
            
            if (percent >= 100) {
                clearInterval(hackInterval);
                setTimeout(() => {
                    document.body.innerHTML = `
                        <div style="
                            background: black;
                            color: red;
                            height: 100vh;
                            display: flex;
                            flex-direction: column;
                            justify-content: center;
                            align-items: center;
                            font-family: monospace;
                            text-align: center;
                        ">
                            <h1 style="font-size: 2rem; margin-bottom: 20px;">!!!دستگاه شما هک شد</h1>
                            <p style="font-size: 1.2rem; color: lime;">نگران نباشید... این فقط یک شوخی بود! 😂</p>
                            <p style="color: white; margin-top: 30px;">ارادتمند مرتضی خان احمدی</p>
                        </div>
                    `;
                    alaramSound.pause();
                }, 1000);
            }
        }, 150);
    </script>
</body>
</html>
